<!-- TRIAGE mark, light. Built like the other Limon-IT product marks (TUNO, ENCA):
     transparent, so it carries on any header colour without a tile behind it.
     Two framings come from one drawing at 1024 - this one keeps the orbit ring;
     assets/favicon.svg crops to the inner disc, because a browser tab renders it
     at 16-32px and the ring is only noise there. Source artwork is
     assets/icons/triage-light.svg on the Limon-IT site, viewBox "0 0 1024 1024",
     with the background rect deliberately not painted here. -->
<svg width="856" height="856" xmlns="http://www.w3.org/2000/svg" viewBox="84 84 856 856">
<defs>
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="bgg" cx="50%" cy="42%" r="75%">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f7ee"/>
  </radialGradient>
  <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f0cf55"/><stop offset="55%" stop-color="#dfb32b"/>
    <stop offset="100%" stop-color="#a8871c"/>
  </linearGradient></defs>
<circle cx="512" cy="512" r="330" fill="#cfe0b4" opacity="0.10"/><circle cx="512" cy="512" r="230" fill="#b7d38e" opacity="0.08"/>
<circle cx="512" cy="512" r="400" fill="none" stroke="#9dbb7a" stroke-width="3" stroke-dasharray="2 14" opacity="0.9"/><circle cx="512" cy="512" r="400" fill="none" stroke="#dfb32b" stroke-width="1.5" opacity="0.35"/>
<circle cx="512.0" cy="112.0" r="9" fill="#3f7a24" filter="url(#glow)"/><circle cx="858.4" cy="312.0" r="9" fill="#3f7a24" filter="url(#glow)"/><circle cx="858.4" cy="712.0" r="9" fill="#3f7a24" filter="url(#glow)"/><circle cx="512.0" cy="912.0" r="9" fill="#3f7a24" filter="url(#glow)"/><circle cx="165.6" cy="712.0" r="9" fill="#3f7a24" filter="url(#glow)"/><circle cx="165.6" cy="312.0" r="9" fill="#3f7a24" filter="url(#glow)"/>
<circle cx="512" cy="512" r="320" fill="none" stroke="#dfb32b" stroke-width="2" opacity="0.4"/><circle cx="512" cy="512" r="265" fill="none" stroke="#cfe0b4" stroke-width="2" opacity="0.55"/>
<g transform="translate(512,505)">
  <g filter="url(#softglow)"><circle r="215" fill="#e9f0dd" stroke="url(#goldg)" stroke-width="16"/></g>
<g transform="translate(-112,-104) scale(1.5)" opacity="0.28"><circle r="24" fill="none" stroke="#3f7a24" stroke-width="7"/><circle r="9" fill="none" stroke="#3f7a24" stroke-width="6"/><line x1="24.0" y1="0.0" x2="36.0" y2="0.0" stroke="#3f7a24" stroke-width="10"/><line x1="17.0" y1="17.0" x2="25.5" y2="25.5" stroke="#3f7a24" stroke-width="10"/><line x1="0.0" y1="24.0" x2="0.0" y2="36.0" stroke="#3f7a24" stroke-width="10"/><line x1="-17.0" y1="17.0" x2="-25.5" y2="25.5" stroke="#3f7a24" stroke-width="10"/><line x1="-24.0" y1="0.0" x2="-36.0" y2="0.0" stroke="#3f7a24" stroke-width="10"/><line x1="-17.0" y1="-17.0" x2="-25.5" y2="-25.5" stroke="#3f7a24" stroke-width="10"/><line x1="-0.0" y1="-24.0" x2="-0.0" y2="-36.0" stroke="#3f7a24" stroke-width="10"/><line x1="17.0" y1="-17.0" x2="25.5" y2="-25.5" stroke="#3f7a24" stroke-width="10"/></g>
<g transform="translate(-18,-24)"><circle cx="0" cy="0" r="112" fill="none" stroke="url(#goldg)" stroke-width="20"/><path d="M-70,4 L-34,4 L-14,-46 L12,54 L34,4 L70,4" fill="none" stroke="#dfb32b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><line x1="82" y1="82" x2="150" y2="150" stroke="url(#goldg)" stroke-width="30" stroke-linecap="round"/></g>
  <circle cx="118" cy="-118" r="13" fill="#3f7a24" filter="url(#glow)"/>
</g>
</svg>