# Limon-IT M365 Triage - nginx site config for the Docker image.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths land on the app (MSAL redirects arrive on /).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Exchange containment backend, same-origin so the CSP stays tight and
    # there is no CORS surface. Resolved at request time so nginx still starts
    # when the backend container is not deployed - the SPA then reports "no
    # backend" and the mailbox step falls back to PowerShell.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $triage_backend "${TRIAGE_BACKEND_HOST}";
        proxy_pass http://$triage_backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_intercept_errors off;
        add_header Cache-Control "no-store" always;
    }

    # The tool talks only to Microsoft. This CSP makes the browser enforce
    # that: even injected JS could not send data anywhere else. If a future
    # feature breaks under it, loosen connect-src here rather than deleting
    # the header. 'unsafe-inline' for styles only (the app uses style="").
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Cache-busted assets (?v=N) can cache; index.html must not.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
