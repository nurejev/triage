<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Limon-IT Microsoft 365 triage. Collect, review and preserve a case in one workspace."
    />
    <title>Triage · Limon-IT</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <script src="js/theme.js?v=34"></script>
    <link rel="stylesheet" href="css/desk.css?v=34" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <button type="button" class="brand" data-step="start" aria-label="Triage home"
          ><img
            src="../assets/logo-mark-light.svg"
            class="only-light"
            alt=""
          /><img
            src="../assets/logo-mark-dark.svg"
            class="only-dark"
            alt=""
          /><span>triage<small>by Limon-IT</small></span
          ><b class="beta">BETA 34</b></button
        >
        <button type="button" id="workflow-toggle" class="workflow-toggle" data-action="toggle-steps" aria-expanded="false" aria-controls="navigation">All steps</button>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <div class="side-bottom">
          <div class="local-dot">Evidence stays with you</div>
          <p>
            Connect required services. Collect with approved access.<br />Review locally.
            Hand over a case file.
          </p>
          <button type="button" data-action="help" class="text-button">
            How it works ↗
          </button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb" id="breadcrumb">
            Limon-IT <span>/</span> Incident workspace
          </div>
          <div class="top-actions">
            <label class="theme-control">
              <span>Theme</span>
              <select id="theme" aria-label="Theme">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
            <span id="connection" class="badge">Not connected</span
            ><button type="button" data-action="signin" id="signin">
              Sign in
            </button>
          </div>
        </header>
        <div id="casebar" class="casebar"></div>
        <div
          id="execution-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        ></div>
        <main id="main" tabindex="-1"></main>
        <!-- Respond: the live first-hour containment runbook shared with the main site (js/contain.js) -->
        <section class="screen" id="screen-contain">
          <div class="card noprint" id="containHead"></div>
          <div id="containBody"></div>
        </section>
        <footer>
          <span>TRIAGE / LIMON-IT</span
          ><span>Read-only collection · Evidence before conclusions</span
          ><button type="button" data-action="help" class="text-button">
            Build 34 · Guide
          </button>
        </footer>
      </div>
    </div>
    <input
      id="import-files"
      type="file"
      accept=".json,.jsonl,.csv"
      multiple
      hidden
    />
    <div id="notification" role="status" aria-live="polite" hidden></div>
    <div class="modal-bg" id="confirmModal">
      <div class="modal">
        <h3 id="cfTitle"></h3>
        <div id="cfBody"></div>
        <div class="modal-row">
          <button type="button" class="btn" id="cfCancel">Cancel</button>
          <button type="button" class="btn danger" id="cfOk">Run</button>
        </div>
      </div>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-head">
        <h2 id="detail-title">Details</h2>
        <button type="button" data-action="close-dialog" aria-label="Close details">✕</button>
      </div>
      <div
        id="dialog-notification"
        class="dialog-notification"
        role="alert"
        tabindex="-1"
        hidden
      ></div>
      <div id="detail-content"></div>
    </dialog>
    <script src="../vendor/msal-browser.min.js"></script>
    <script src="js/build.js?v=34"></script>
    <script src="js/authConfig.js?v=34"></script>
    <script src="js/graph.js?v=34"></script>
    <script src="js/evidence.js?v=34"></script>
    <script src="js/blacklists.js?v=34"></script>
    <script src="js/exchange-analysis.js?v=34"></script>
    <script src="js/analyzers.js?v=34"></script>
    <script src="js/import.js?v=34"></script>
    <script src="js/demo.js?v=34"></script>
    <script src="js/collect.js?v=34"></script>
    <script src="../js/journal.js?v=34"></script>
    <script src="../js/analysis-service.js?v=34"></script>
    <script src="../js/templates.js?v=34"></script>
    <script src="../js/case.js?v=34"></script>
    <script src="../js/demoblast.js?v=34"></script>
    <script src="../js/blast.js?v=34"></script>
    <script src="../js/contain.js?v=34"></script>
    <script src="js/desk-model.js?v=34"></script>
    <script src="js/coverage.js?v=34"></script>
    <script src="js/first-hour.js?v=34"></script>
    <script src="js/desk.js?v=34"></script>
  </body>
</html>
