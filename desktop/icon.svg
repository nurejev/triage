<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- macOS-style squircle -->
    <clipPath id="squircle">
      <path d="M512 0C170 0 0 170 0 512s170 512 512 512 512-170 512-512S854 0 512 0z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b32"/>
      <stop offset="1" stop-color="#153a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#5fa04a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fa04a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d76a"/>
      <stop offset="0.55" stop-color="#dfb32b"/>
      <stop offset="1" stop-color="#b08a1d"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#eef5e6" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- faint orbit ring like the web mark -->
    <circle cx="512" cy="512" r="418" fill="none" stroke="#9dbb7a" stroke-width="4" stroke-dasharray="3 22" opacity="0.35"/>
    <!-- lens shadow -->
    <circle cx="470" cy="470" r="236" fill="#000" opacity="0.28" filter="url(#soft)"/>
  </g>
  <!-- magnifier -->
  <g filter="url(#shadow)">
    <!-- handle -->
    <path d="M652 652 L800 800" stroke="url(#gold)" stroke-width="78" stroke-linecap="round"/>
    <path d="M652 652 L800 800" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.18"/>
    <!-- ring -->
    <circle cx="470" cy="470" r="236" fill="url(#lens)" stroke="url(#gold)" stroke-width="48"/>
    <circle cx="470" cy="470" r="212" fill="none" stroke="#fff" stroke-width="6" opacity="0.15"/>
  </g>
  <!-- pulse trace inside the lens -->
  <path d="M300 480 H372 L404 400 L444 560 L484 330 L524 590 L556 480 H640" fill="none" stroke="#f6f9f1" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 480 H372 L404 400 L444 560 L484 330 L524 590 L556 480 H640" fill="none" stroke="#dfb32b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- lens highlight -->
  <ellipse cx="380" cy="330" rx="120" ry="60" fill="#fff" opacity="0.10" transform="rotate(-35 380 330)"/>
</svg>
