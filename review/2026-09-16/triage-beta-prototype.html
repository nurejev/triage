<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"></head>
<body>
<title>Triage Beta Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;750&display=swap">
<style>
/* ===== BETA 30 desk.css, verbatim ===== */
:root {
  --bg: #f2f7f3;
  --surface: #fff;
  --ink: #12331f;
  --muted: #5f7a67;
  --border: #dbe7de;
  --soft: #eaf3ec;
  --green: #1e4729;
  --lemon: #f7d65a;
  --red: #b63a39;
  --red-bg: #fff0ed;
  --amber: #846211;
  --amber-bg: #fff8dd;
  --blue: #23638d;
  --blue-bg: #edf5fc;
  --neutral: #647079;
  --neutral-bg: #f0f2f4;
  --radius: 7px;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}
[data-theme="dark"] {
  --bg: #0f1512;
  --surface: #161d19;
  --ink: #e6f0e8;
  --muted: #9bb3a3;
  --border: #2c3e32;
  --soft: #1c2b21;
  --green: #b2dbb6;
  --red: #ffa19c;
  --red-bg: #3d2020;
  --amber: #f7d65a;
  --amber-bg: #362e16;
  --blue: #8fc6e7;
  --blue-bg: #1a2e3b;
  --neutral: #a9b4bd;
  --neutral-bg: #252c30;
}
* {
  box-sizing: border-box;
}
.collection-details > summary {
  padding: 18px 22px;
  cursor: pointer;
  font-weight: 600;
}
.collection-details > summary span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  margin-left: 12px;
}
.collection-details .command {
  margin: 0 22px 22px;
  max-height: 260px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
body {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 5px;
  padding: 9px 13px;
  font-weight: 550;
}
button:hover {
  border-color: var(--muted);
  background: var(--soft);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
a {
  color: var(--green);
  text-underline-offset: 3px;
}
button.primary,
.primary {
  background: var(--green);
  color: var(--surface);
  border: 1px solid var(--green);
}
[data-theme="dark"] button.primary {
  background: var(--lemon);
  border-color: var(--lemon);
  color: #12331f;
}
button.lemon {
  background: var(--lemon);
  color: #12331f;
  border-color: var(--lemon);
}
button.text-button {
  border: 0;
  background: none;
  padding: 3px 0;
  color: var(--muted);
  text-align: left;
  font-size: 12px;
}
.shell {
  display: grid;
  grid-template-columns: 216px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 26px 17px;
}
.brand {
  display: flex;
  gap: 7px;
  align-items: center;
  text-decoration: none;
  margin-bottom: 43px;
}
.brand img {
  width: 39px;
  height: 39px;
}
.brand > span {
  font-weight: 750;
  letter-spacing: -1px;
  font-size: 25px;
  line-height: 1;
}
.brand small {
  display: block;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  margin-top: 7px;
}
.beta {
  flex-shrink: 0;
  white-space: nowrap;
  font-size: 8px;
  letter-spacing: 0.7px;
  margin: 0 0 18px auto;
  padding: 3px 5px;
  background: var(--lemon);
  color: #12331f;
  border-radius: 3px;
}
.only-dark {
  display: none;
}
[data-theme="dark"] .only-dark {
  display: block;
}
[data-theme="dark"] .only-light {
  display: none;
}
.side-label {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 1.8px;
  margin: 0 11px 12px;
  font-weight: 650;
}
nav {
  display: grid;
  gap: 5px;
}
nav button {
  display: flex;
  gap: 11px;
  align-items: center;
  background: none;
  border: 1px solid transparent;
  text-align: left;
  font-size: 13px;
  padding: 11px 12px;
  color: var(--muted);
}
nav button[aria-current="page"] {
  background: var(--soft);
  border-color: var(--border);
  color: var(--green);
}
nav .nav-icon {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 400;
}
nav .count {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
}
nav hr {
  width: 100%;
  border: 0;
  border-top: 1px solid var(--border);
  margin: 15px 0;
}
.side-bottom {
  margin-top: auto;
  padding: 30px 10px 0;
  font-size: 11px;
  color: var(--muted);
}
.side-bottom p {
  line-height: 1.7;
}
.side-bottom button {
  display: block;
  margin-top: 12px;
}
.local-dot:before {
  content: "";
  display: inline-block;
  background: #639954;
  border-radius: 50%;
  width: 6px;
  height: 6px;
  margin-right: 7px;
}
.workspace {
  min-width: 0;
}
.topbar {
  padding: 17px 34px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  min-height: 72px;
}
.breadcrumb {
  font-size: 11px;
  color: var(--muted);
}
.breadcrumb span {
  margin: 0 12px;
  color: #a8b7ac;
}
.top-actions,
.row-actions {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
}
.top-actions button {
  font-size: 11px;
}
.theme-control {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.theme-control select {
  width: auto;
  min-height: 36px;
  padding: 7px 9px;
  font-size: 11px;
  margin: 0;
}
.badge {
  display: inline-block;
  border: 1px solid var(--border);
  background: var(--soft);
  color: var(--muted);
  border-radius: 4px;
  padding: 3px 7px;
  font-size: 10px;
  line-height: 1.5;
  white-space: nowrap;
}
.badge.complete,
.badge.verified,
.badge.benign {
  color: var(--green);
  background: var(--soft);
}
.badge.High,
.badge.Critical,
.badge.failed {
  color: var(--red);
  background: var(--red-bg);
  border-color: transparent;
}
.badge.Medium,
.badge.partial,
.badge.unavailable,
.badge.pending {
  color: var(--amber);
  background: var(--amber-bg);
  border-color: transparent;
}
.badge.running,
.badge.imported,
.badge.Low {
  color: var(--blue);
  background: var(--blue-bg);
  border-color: transparent;
}
.casebar {
  padding: 11px 34px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  align-items: center;
}
.casebar strong {
  margin-right: 10px;
}
.casebar .row-actions button {
  font-size: 10px;
  padding: 4px 8px;
}
main {
  padding: 33px 34px 44px;
  max-width: 1580px;
  margin: auto;
  min-height: calc(100vh - 176px);
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -1px;
  margin-bottom: 9px;
  font-weight: 650;
}
h2 {
  font-size: 16px;
  letter-spacing: -0.25px;
  margin-bottom: 5px;
}
h3 {
  font-size: 13px;
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 1.7px;
  color: var(--muted);
  font-weight: 650;
  margin-bottom: 12px;
}
.subtitle {
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
  max-width: 710px;
  margin-bottom: 0;
}
.page-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 27px;
}
.page-head .row-actions {
  justify-content: flex-end;
}
.grid-2 {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(260px, 1fr);
  gap: 19px;
}
.grid-even {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 19px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-width: 0;
  overflow: hidden;
}
.panel-body {
  padding: 23px;
}
.panel-head {
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.panel-head p {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0 0;
}
.panel-head h2 {
  font-size: 14px;
}
.panel-foot {
  padding: 13px 22px;
  background: var(--soft);
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
}
.hero-card {
  padding: 25px;
  position: relative;
}
.hero-card p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  min-height: 64px;
}
.hero-card .path-number {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 30px;
  display: block;
}
.hero-card h2 {
  font-size: 20px;
  margin-bottom: 12px;
}
.hero-card.primary-path {
  border-top: 3px solid var(--green);
  padding-top: 23px;
}
.hero-card .path-icon {
  float: right;
  font-size: 28px;
  color: var(--green);
}
.hero-card ul {
  font-size: 12px;
  color: var(--muted);
  padding-left: 16px;
  line-height: 2;
  margin: 20px 0 28px;
}
.hero-card button {
  width: 100%;
  text-align: left;
  display: flex;
  justify-content: space-between;
}
.welcome-strip {
  margin: 23px 0 30px;
  padding: 20px 23px;
  background: var(--green);
  color: var(--surface);
  display: flex;
  align-items: center;
  gap: 19px;
  border-radius: 7px;
}
[data-theme="dark"] .welcome-strip {
  background: #1e4729;
  color: #e6f0e8;
}
.welcome-strip p {
  font-size: 12px;
  opacity: 0.8;
  margin: 3px 0 0;
}
.welcome-strip .big-symbol {
  font-size: 27px;
  color: var(--lemon);
}
.welcome-strip button {
  margin-left: auto;
}
.section-gap {
  margin-top: 22px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px;
  margin-bottom: 23px;
}
.stat {
  padding: 18px 21px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
}
.stat-label {
  font-size: 10px;
  color: var(--muted);
}
.stat strong {
  display: block;
  font-size: 30px;
  font-weight: 550;
  letter-spacing: -1px;
  margin: 5px 0 0;
}
.stat small {
  font-size: 10px;
  color: var(--muted);
}
.stat.attention strong {
  color: var(--red);
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
label.field {
  display: grid;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 15px;
}
.quick-account-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px;
  margin-bottom: 15px;
}
.quick-account-row label.field {
  min-width: 0;
  margin-bottom: 0;
}
.quick-account-row button {
  min-height: 40px;
  white-space: nowrap;
}
.execution-card {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 13px 15px;
  margin: 16px 0;
  --execution-ink: var(--neutral);
  --execution-bg: var(--neutral-bg);
}
.execution-card[data-engine="powershell"] {
  --execution-ink: var(--blue);
  --execution-bg: var(--blue-bg);
}
.execution-card[data-engine="browser-js"],
.execution-card[data-engine="analysis-js"] {
  --execution-ink: var(--amber);
  --execution-bg: var(--amber-bg);
}
.execution-symbol {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 4px;
  background: var(--execution-bg);
  color: var(--execution-ink);
  font-size: 12px;
  font-weight: 750;
}
.execution-copy strong {
  display: block;
  font-size: 13px;
}
.execution-copy p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.execution-stage {
  background: var(--execution-bg);
  color: var(--execution-ink);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 650;
}
#execution-status {
  padding: 12px 34px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  z-index: 4;
}
#execution-status[hidden] {
  display: none;
}
#execution-status[data-active="true"] {
  position: sticky;
  top: 0;
}
#execution-status .execution-card {
  border: 0;
  padding: 0;
  margin: 0;
}
@media (max-width: 760px) {
  #execution-status {
    padding: 12px 18px;
  }
  .execution-card {
    gap: 9px;
  }
  .execution-stage {
    align-self: start;
  }
}
.account-hint {
  margin-top: -5px;
  margin-bottom: 20px;
}
@media (max-width: 480px) {
  .quick-account-row {
    grid-template-columns: 1fr;
  }
}
input,
select,
textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px 11px;
  outline: none;
}
textarea {
  min-height: 92px;
  resize: vertical;
}
input:focus,
select:focus,
textarea:focus,
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--lemon);
  outline-offset: 2px;
  border-color: var(--green);
}
label.check {
  display: flex;
  gap: 10px;
  align-items: start;
  font-size: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
label.check input {
  width: 15px;
  accent-color: var(--green);
  margin-top: 4px;
}
label.check span {
  flex: 1;
}
label.check small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}
.form-note,
.muted {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}
.notice {
  padding: 13px 16px;
  border-left: 3px solid var(--lemon);
  background: var(--amber-bg);
  color: var(--amber);
  font-size: 12px;
  border-radius: 3px;
  margin: 16px 0;
}
.notice.error {
  border-color: var(--red);
  color: var(--red);
  background: var(--red-bg);
}
.source-row {
  scroll-margin-top: 16px;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto 14px;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 0;
  background: transparent;
  align-items: center;
  gap: 11px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.source-group:last-child > .source-row {
  border-bottom: 0;
}
.source-row:hover,
.source-row[aria-expanded="true"] {
  background: var(--soft);
}
.source-label {
  min-width: 0;
  overflow-wrap: anywhere;
}
.source-label strong {
  font-weight: 650;
  font-size: 12px;
}
.source-state-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--neutral);
  background: var(--neutral-bg);
  font-size: 16px;
  font-weight: 700;
}
.source-result {
  display: grid;
  justify-items: end;
  gap: 5px;
}
.source-status {
  color: var(--neutral);
  background: var(--neutral-bg);
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
}
.source-row[data-state="complete"] .source-state-icon,
.source-row[data-state="complete"] .source-status {
  color: var(--green);
  background: var(--soft);
}
.source-row[data-state="running"] {
  background: var(--blue-bg);
  box-shadow: inset 3px 0 var(--blue);
}
.source-row[data-state="running"] .source-status {
  color: var(--blue);
  background: var(--surface);
}
.readiness-checking {
  display: flex;
  align-items: center;
  gap: 12px;
}
.readiness-checking::before {
  content: "";
  flex: 0 0 22px;
  height: 22px;
  box-sizing: border-box;
}
.source-row[data-state="running"] .source-state-icon,
.readiness-checking::before {
  width: 22px;
  height: 22px;
  margin: 3px;
  background: transparent;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-right-color: var(--blue);
  animation: collection-spin 1s linear infinite;
}
.readiness-checking::before { border-radius: 50%; }
.source-row:is([data-state="failed"], [data-state="unavailable"]) {
  box-shadow: inset 3px 0 var(--red);
}
.source-row:is([data-state="failed"], [data-state="unavailable"])
  .source-state-icon,
.source-row:is([data-state="failed"], [data-state="unavailable"])
  .source-status {
  color: var(--red);
  background: var(--red-bg);
  border-color: transparent;
}
.source-row:is(
    [data-state="partial"],
    [data-state="cancelled"],
    [data-state="interrupted"]
  )
  .source-state-icon,
.source-row:is(
    [data-state="partial"],
    [data-state="cancelled"],
    [data-state="interrupted"]
  )
  .source-status {
  color: var(--amber);
  background: var(--amber-bg);
}
.source-row[data-state="imported"] .source-state-icon,
.source-row[data-state="imported"] .source-status {
  color: var(--blue);
  background: var(--blue-bg);
}
@keyframes collection-spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .source-row[data-state="running"] .source-state-icon,
  .readiness-checking::before {
    animation: none;
  }
}
.coverage-summary {
  padding: 19px 20px 17px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.collection-coverage .panel-head .text-button {
  white-space: nowrap;
  flex-shrink: 0;
}
.coverage-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.coverage-eyebrow {
  font-size: 9px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.coverage-heading p {
  margin: 3px 0 12px;
  font-size: 12px;
}
.coverage-heading strong {
  font-size: 24px;
  letter-spacing: -0.03em;
}
.coverage-percent {
  font-size: 19px;
  font-weight: 650;
  color: var(--green);
}
.coverage-meter {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  overflow: hidden;
}
.coverage-meter span {
  display: block;
  height: 100%;
  background: var(--green);
}
.coverage-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 12px;
}
.coverage-key {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--neutral);
  font-size: 10px;
  font-weight: 600;
}
.coverage-key i {
  font-style: normal;
  font-size: 13px;
}
.coverage-key[data-state="complete"] {
  color: var(--green);
}
.coverage-key:is([data-state="running"], [data-state="imported"]) {
  color: var(--blue);
}
.coverage-key:is([data-state="failed"], [data-state="unavailable"]) {
  color: var(--red);
}
.coverage-key:is(
  [data-state="partial"],
  [data-state="cancelled"],
  [data-state="interrupted"]
) {
  color: var(--amber);
}
.coverage-current {
  color: var(--blue);
  background: var(--blue-bg);
  border-radius: 4px;
  margin: 13px 0 0;
  padding: 9px 11px;
  font-size: 11px;
  font-weight: 600;
}
.coverage-footer {
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  color: var(--muted);
  font-size: 10px;
}
.coverage-footer span {
  display: block;
  margin-top: 3px;
}
.source-arrow {
  font-size: 19px;
  width: 18px;
  text-align: center;
  color: var(--green);
}
.source-details {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid var(--green);
}
.source-detail-head {
  margin-bottom: 15px;
}
.source-detail-head h3 {
  margin: 0 0 6px;
}
.source-metadata {
  margin: 12px 0;
  font-size: 11px;
}
.source-metadata summary {
  cursor: pointer;
  color: var(--muted);
}
.source-record-list .finding {
  padding-left: 0;
  padding-right: 0;
}
.source-row small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}
.source-count {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  font-size: 11px;
  font-weight: 600;
  text-align: right;
}
.finding {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 13px;
  padding: 16px 21px;
  border: 0;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  width: 100%;
  text-align: left;
  align-items: start;
  font-weight: 400;
}
.finding:last-child {
  border-bottom: 0;
}
.finding strong {
  font-size: 12px;
  display: block;
  font-weight: 600;
}
.finding small {
  font-size: 10px;
  color: var(--muted);
  display: block;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.finding .arrow {
  color: var(--muted);
}
.empty {
  padding: 45px 24px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}
.empty .empty-icon {
  font-size: 34px;
  margin-bottom: 15px;
  color: var(--green);
}
.filter-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.filter-bar input {
  flex: 1;
  min-width: 150px;
}
.filter-bar select {
  width: auto;
  max-width: 200px;
  font-size: 12px;
}
.timeline-row,
.log-row {
  display: grid;
  grid-template-columns: 136px 1fr;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  padding: 15px 21px;
  font-size: 12px;
}
.timeline-row time,
.log-row time {
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.timeline-row strong,
.log-row strong {
  display: block;
  font-size: 12px;
}
.timeline-row small,
.log-row small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}
.phase-track {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  margin-bottom: 25px;
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
}
.phase-track button {
  border: 0;
  border-right: 1px solid var(--border);
  border-radius: 0;
  text-align: left;
  padding: 16px 13px;
  background: var(--surface);
  font-size: 11px;
}
.phase-track button:last-child {
  border: 0;
}
.phase-track button[aria-current="step"] {
  background: var(--green);
  color: var(--surface);
}
[data-theme="dark"] .phase-track button[aria-current="step"] {
  background: #1e4729;
  color: #e6f0e8;
}
.phase-track small {
  display: block;
  font-size: 9px;
  opacity: 0.7;
  margin-bottom: 8px;
}
.phase-track b {
  display: block;
  margin-bottom: 6px;
  font-size: 10px;
}
.run-step {
  padding: 15px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  display: flex;
  gap: 10px;
}
.run-step b {
  width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 9px;
  flex-shrink: 0;
}
.run-step p {
  color: var(--muted);
  font-size: 11px;
  margin: 4px 0 0;
}
.command {
  padding: 13px 16px;
  background: var(--bg);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 10px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--muted);
  max-height: 270px;
  overflow: auto;
}
.flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 25px 0;
  font-size: 11px;
}
.flow > div {
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 5px;
  text-align: center;
  flex: 1;
}
.flow small {
  display: block;
  color: var(--muted);
  font-size: 9px;
}
.flow > span {
  color: var(--muted);
}
.os-buttons {
  display: flex;
  gap: 9px;
  margin: 20px 0;
}
.os-buttons button {
  flex: 1;
}
.progress {
  height: 5px;
  background: var(--soft);
  border-radius: 4px;
  overflow: hidden;
  margin: 14px 0;
}
.progress div {
  height: 100%;
  background: var(--green);
  transition: width 0.2s;
}
.table-scroll {
  overflow: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 11px;
}
th {
  text-align: left;
  color: var(--muted);
  background: var(--soft);
  font-size: 9px;
  letter-spacing: 0.5px;
}
td,
th {
  padding: 12px 17px;
  border-bottom: 1px solid var(--border);
}
td {
  max-width: 420px;
  overflow-wrap: anywhere;
}
.small-link {
  font-size: 11px;
}
.record-ref {
  font-family: ui-monospace, monospace;
  font-size: 10px;
}
footer {
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 34px;
  color: var(--muted);
  font-size: 9px;
  gap: 15px;
}
footer span:first-child {
  letter-spacing: 1px;
}
#notification {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  width: max-content;
  background: var(--green);
  color: var(--surface);
  border-radius: 6px;
  padding: 13px 20px;
  z-index: 10;
  font-size: 12px;
}
[data-theme="dark"] #notification {
  background: var(--lemon);
  color: #12331f;
}
#notification[data-error="true"] {
  background: var(--red);
  color: var(--surface);
}
dialog {
  width: min(820px, calc(100vw - 30px));
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 0;
  max-height: 88vh;
}
dialog::backdrop {
  background: #071c136b;
}
.dialog-head {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 17px 23px;
  z-index: 1;
}
.dialog-head h2 {
  margin: 0;
  font-size: 16px;
}
.dialog-head button {
  padding: 5px 10px;
}
#detail-content {
  padding: 24px;
}
.dialog-notification {
  padding: 12px 16px;
  border-left: 3px solid var(--red);
  border-radius: 4px;
  background: var(--red-bg);
  color: var(--red);
  font-size: 13px;
}
#dialog-notification {
  margin: 20px 24px 0;
}
.field-error {
  color: var(--red);
  font-size: 12px;
}
.oauth-scope-note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px 24px;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 22px;
  font-size: 12px;
}
.oauth-scope-note > div {
  flex: 1 1 260px;
}
.oauth-scope-note strong {
  font-size: 13px;
}
.oauth-scope-note p {
  margin: 4px 0 0;
  color: var(--muted);
}
.field [aria-invalid="true"] {
  border-color: var(--red);
}
pre.raw {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 11px;
  max-height: 390px;
  overflow: auto;
  border: 1px solid var(--border);
  padding: 17px;
  border-radius: 5px;
  background: var(--bg);
}
.toolbar-note {
  font-size: 10px;
  color: var(--muted);
  margin-top: 9px;
}
.split-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.stack {
  display: grid;
  gap: 18px;
}
.page-size {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
}
.pill {
  display: inline-block;
  padding: 4px 7px;
  background: var(--soft);
  font-size: 10px;
  border-radius: 3px;
  margin: 3px;
}
.native-title {
  color: var(--muted);
  font-size: 11px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.native-title i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #acc3b1;
}
.native-title span {
  margin-left: 10px;
}
@media (min-width: 1600px) {
  main {
    padding-top: 45px;
  }
  .grid-3 {
    gap: 23px;
  }
  .hero-card {
    padding: 30px;
  }
  .hero-card.primary-path {
    padding-top: 28px;
  }
}
@media (max-width: 1050px) {
  .shell {
    grid-template-columns: 183px minmax(0, 1fr);
  }
  .sidebar {
    padding: 24px 12px;
  }
  .brand > span {
    font-size: 22px;
  }
  .brand img {
    width: 32px;
  }
  .topbar,
  main,
  .casebar {
    padding-left: 23px;
    padding-right: 23px;
  }
  .grid-2 {
    grid-template-columns: 1fr;
  }
  .hero-card {
    padding: 18px;
  }
  .hero-card.primary-path {
    padding-top: 16px;
  }
  .hero-card h2 {
    font-size: 17px;
  }
  .hero-card p {
    min-height: 88px;
  }
  .stats {
    gap: 10px;
  }
  .stat {
    padding: 15px;
  }
  .top-actions .badge {
    display: none;
  }
  .phase-track button {
    padding: 13px 9px;
  }
}
@media (max-width: 760px) {
  .shell {
    display: block;
  }
  .sidebar {
    position: static;
    width: 100%;
    height: auto;
    padding: 16px 18px 0;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    margin: 0 0 17px;
    width: 185px;
  }
  .side-label,
  .side-bottom {
    display: none;
  }
  nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    margin: 0 -18px;
    padding: 0 12px 12px;
  }
  nav button {
    flex-shrink: 0;
    font-size: 11px;
    padding: 8px;
  }
  nav .nav-icon,
  nav .count,
  nav hr {
    display: none;
  }
  .topbar {
    padding: 12px 18px;
    min-height: 52px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .breadcrumb {
    font-size: 10px;
    flex-basis: 100%;
  }
  .top-actions {
    width: 100%;
    justify-content: space-between;
    gap: 7px;
  }
  .breadcrumb span {
    margin: 0 5px;
  }
  .top-actions button {
    font-size: 10px;
    padding: 7px;
  }
  .casebar {
    padding: 9px 18px;
    align-items: start;
    flex-wrap: wrap;
  }
  main {
    padding: 25px 18px;
  }
  .page-head {
    align-items: start;
    flex-direction: column;
    gap: 15px;
  }
  h1 {
    font-size: 27px;
  }
  .grid-3,
  .grid-even {
    grid-template-columns: 1fr;
  }
  .hero-card p {
    min-height: 0;
  }
  .hero-card ul {
    margin: 10px 0 19px;
  }
  .hero-card .path-number {
    margin-bottom: 15px;
  }
  .welcome-strip {
    align-items: start;
    flex-wrap: wrap;
    padding: 17px;
  }
  .welcome-strip button {
    margin-left: 0;
  }
  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .phase-track {
    grid-template-columns: 1fr;
  }
  .phase-track button {
    display: flex;
    gap: 10px;
    align-items: center;
    border: 0;
    border-bottom: 1px solid var(--border);
  }
  .phase-track small,
  .phase-track b {
    margin: 0;
  }
  .phase-track small {
    min-width: 62px;
  }
  .phase-track b {
    min-width: 103px;
  }
  .panel-body {
    padding: 18px;
  }
  .panel-head {
    padding: 15px 18px;
  }
  .source-row {
    padding: 12px 15px;
    gap: 8px;
  }
  .field-grid {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .timeline-row,
  .log-row {
    grid-template-columns: 1fr;
    gap: 5px;
    padding: 14px 16px;
  }
  .finding {
    padding: 14px;
    gap: 9px;
  }
  .finding .badge {
    font-size: 9px;
  }
  .page-head .row-actions {
    justify-content: start;
  }
  footer {
    padding: 15px 18px;
    flex-wrap: wrap;
  }
  footer span:nth-child(2) {
    display: none;
  }
  .flow {
    gap: 5px;
    font-size: 10px;
  }
  .flow > div {
    padding: 8px 5px;
  }
  #detail-content {
    padding: 17px;
  }
  .os-buttons {
    flex-wrap: wrap;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

/* The next investigation starts where the user is working. */
.new-case-panel {
  max-width: 740px;
  margin: 50px auto 85px;
  padding: 44px;
  text-align: center;
  overflow: visible;
}
.new-case-symbol {
  display: grid;
  place-items: center;
  width: 58px;
  height: 58px;
  margin: 0 auto 22px;
  border-radius: 12px;
  background: var(--soft);
  color: var(--green);
  font-size: 34px;
}
.new-case-panel h2 {
  font-size: 28px;
  letter-spacing: -0.7px;
  margin-bottom: 13px;
}
.new-case-panel .subtitle {
  max-width: 480px;
  margin: 0 auto 24px;
}
.current-case-summary {
  display: grid;
  gap: 5px;
  padding: 18px;
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow-wrap: anywhere;
  text-align: left;
  margin: 22px 0;
}
.current-case-summary span {
  font-size: 11px;
  color: var(--muted);
}
.new-case-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}
.new-case-actions .primary {
  padding: 13px 25px;
  font-size: 15px;
}
.new-case-panel > .row-actions {
  justify-content: center;
  gap: 28px;
  margin-top: 22px;
}
@media (max-width: 760px) {
  .new-case-panel {
    margin: 16px auto 35px;
    padding: 26px 18px;
  }
  .new-case-panel h2 {
    font-size: 24px;
  }
  .new-case-actions {
    display: grid;
  }
  .new-case-panel > .row-actions {
    gap: 16px;
  }
}

@media (max-width: 760px) {
  .source-row {
    grid-template-columns: 28px minmax(0, 1fr) auto 12px;
  }
  .source-label {
    grid-column: auto;
  }
  .source-result {
    grid-column: 2 / 4;
    grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .source-label {
    grid-column: 2 / 4;
  }
  .source-arrow {
    grid-column: 4;
    grid-row: 1 / 3;
  }
  .source-state-icon {
    grid-column: 1;
    grid-row: 1 / 3;
  }
  .coverage-summary {
    padding: 16px;
  }
  .source-details {
    padding: 16px;
  }
}

.macos-download-note {
  margin: 20px 0;
  padding: 18px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--lemon);
  border-radius: var(--radius);
  background: var(--soft);
}
.macos-download-note h3 {
  margin: 0 0 10px;
}
.macos-download-note p {
  margin: 10px 0;
}
.macos-download-note .command {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 12px;
}
.macos-download-note summary {
  cursor: pointer;
  font-weight: 550;
}

.service-connections {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 8px 0 4px;
}
.service-connection {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex: 1 1 260px;
  min-width: 0;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  font-size: 12px;
}
.service-connection strong,
.service-connection small {
  display: block;
  overflow-wrap: anywhere;
}
.service-connection small {
  color: var(--muted);
  margin-top: 4px;
}
.service-connection .badge {
  flex-shrink: 0;
}

.connection-picker {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
  margin-bottom: 20px;
}

/* Brand is a button (not a link) so it never reloads the page and drops an open case. */
.brand { background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
/* Review dispositions: confirmed / investigating / exception must read differently from unreviewed. */
.badge.confirmed { background: #b42318; color: #fff; }
.badge.investigating { background: #b54708; color: #fff; }
.badge.exception, .badge.false-positive { background: #475467; color: #fff; }
.badge.unreviewed { background: transparent; border: 1px dashed currentColor; }
.badge.in-progress { background: #175cd3; color: #fff; }
.badge.Info { background: #e4e7ec; color: #344054; }
:root[data-theme="dark"] .badge.Info { background: #2b3a31; color: #d0d5dd; }

/* "by Limon-IT" stays on one line at every sidebar width. */
.brand span { white-space: nowrap; }
.brand small { white-space: nowrap; }

/* ==== Containment runbook styles, scoped from css/app.css (js/contain.js + js/blast.js render these) ==== */
#screen-contain .muted {color: var(--muted);}
#screen-contain .mini {font-size: 12px;}
#screen-contain .num {font-variant-numeric: tabular-nums;}
#screen-contain .hspacer {margin-left: auto;}
#screen-contain .demo-pill {flex: none; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  border-radius: 999px; padding: 3px 10px;
  background: var(--lemon); color: #12331f; border: 1px solid var(--lemon-deep);}
#screen-contain .demo-banner {display: flex; align-items: center; gap: 16px; flex-wrap: wrap;}
#screen-contain .demo-banner .mini {flex: 1 1 320px;}
#screen-contain .btn {border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer;}
#screen-contain .btn:hover {background: var(--soft);}
#screen-contain .btn:disabled {opacity: .45; cursor: default;}
#screen-contain .btn.primary {background: var(--green); border-color: var(--green); color: #fff; font-weight: 600;}
#screen-contain .btn.primary:hover {background: var(--accent2); border-color: var(--accent2);}
#screen-contain .btn.lemon {background: var(--lemon); border-color: var(--lemon-deep); color: #12331f; font-weight: 600;}
#screen-contain .btn.lemon:hover {background: var(--lemon-deep);}
#screen-contain .btn.small {padding: 4px 10px; font-size: 12px; border-radius: 8px;}
#screen-contain .btn.danger {background: var(--sev-critical); border-color: var(--sev-critical); color: #fff; font-weight: 600;}
#screen-contain .btn.danger:hover {background: #b32f2f; border-color: #b32f2f;}

    if (b.id === "cfCancel") { closeDialog(); return; }

    if (b.dataset.surface) { S.surface = b.dataset.surface; if (S.surface === "web") { S.svc.exchange = { state: "idle" }; S.signAs = "delegated"; if (!["quick", "custom"].includes(S.scope.preset)) S.scope.preset = "quick"; } else if (S.scope.preset === "quick" && !k) S.scope.preset = "standard"; persist(true); render(); return; }
    if (b.dataset.step) {
      const st = stepState(b.dataset.step); if (st.cls === "todo" && b.dataset.step !== route.step) { toast(st.reason, true); return; }
      if (["connect", "scope"].includes(b.dataset.step) && k && !k.collecting && b.closest("nav")) { confirmModal("Go back to " + (b.dataset.step === "scope" ? "Scope" : "Connect") + "?", `<p class="mini">The current case stays saved and listed under Open a case. Changing the scope or the sign-in starts a <strong>new</strong> collection.</p>`, "Go back and start a new case", () => { S.saved.unshift({ id: k.id, subject: k.scope === "tenant" ? "Whole tenant" : k.subject, tenantName: k.tenantName, savedAt: new Date().toISOString(), findings: k.findings.length, snapshot: k }); S.kase = null; S.svc.response = { state: "idle" }; persist(true); navigate({ step: b.dataset.step }); }); return; }
      closeDialog(); navigate({ step: b.dataset.step, caseId: k?.id, tab: b.dataset.tab || (b.dataset.step === "review" ? "overview" : b.dataset.step === "respond" ? (route.step === "respond" ? route.tab : "preserve") : undefined) }); return;
    }
    if (b.dataset.pick) { S.scope.upn = b.dataset.pick; persist(); render(); return; }
    const act = b.dataset.act; if (!act) return;
    switch (act) {
      case "reset": clearTimeout(timers.collect); clearTimeout(timers.analyze); S = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} closeDialog(); navigate({ step: "start" }); toast("Demo reset"); break;
      case "brand": navigate(k ? { step: "review", tab: "overview" } : { step: "start" }); break;
      case "help": helpDialog(); break;
      case "close-dialog": closeDialog(); break;
      case "topbar-session": if (S.svc.graph.state === "ready") { confirmModal("Disconnect?", `<p class="mini">Signs out of ${esc(S.svc.graph.account)}. An open case stays saved; collecting again means signing in again on Connect.</p>`, "Disconnect", () => { clearTimeout(timers.graph); S.svc.graph = { state: "idle" }; S.svc.exchange = { state: "idle" }; S.svc.response = { state: "idle" }; if (k) k.armed = false; persist(true); navigate({ step: "connect" }); }); } else navigate({ step: "connect" }); break;
      case "new-investigation": navigate(connected() ? { step: "scope" } : { step: "connect" }); break;
      case "open-case": openCaseDialog(); break;
      case "pick-file": closeDialog(); toast("A file picker would open here; the case is integrity-checked, then Review opens."); break;
      case "open-saved": { const c = S.saved.find(x => x.id === b.dataset.id); if (c) { closeDialog(); S.kase = { ...c.snapshot, handedOver: false, dirty: false, armed: false }; S.svc.response = { state: "idle" }; if (!connected()) S.svc.graph = { state: "ready", account: "analyst@limon-it.nl", tenantName: c.tenantName, tenantId: "…" }; persist(true); navigate({ step: "review", tab: "overview", caseId: S.kase.id }); toast("Opened saved case · " + c.subject); } break; }
      case "remove-saved": S.saved = S.saved.filter(x => x.id !== b.dataset.id); persist(true); openCaseDialog(); break;
      case "continue-last": { const c = S.saved[0]; if (c) { S.kase = { ...c.snapshot, handedOver: false, dirty: false, armed: false }; S.svc.response = { state: "idle" }; if (!connected()) S.svc.graph = { state: "ready", account: "analyst@limon-it.nl", tenantName: c.tenantName, tenantId: "…" }; persist(true); navigate({ step: "review", tab: "overview", caseId: S.kase.id }); } break; }
      case "sample": loadSample(); break;
      case "open-plan": toast("A file picker would open; the plan fills Scope and you continue from there."); break;
      case "get-app": toast("Links to the GitHub Release assets (macOS arm64 / Windows x64)."); break;
      case "resolve": { const d = ($("#domain")?.value || S.domain).trim().toLowerCase(); S.domain = d; const t = TENANTS[d]; if (t) { S.tenant = { name: t[0], id: t[1] }; toast("Resolved " + d + " → " + t[0]); } else { S.tenant = null; toast("No tenant found for " + (d || "that domain") + " — try contoso.com, fabrikam.com or northwind.nl", true); } persist(); render(); break; }
      case "signin": if (b.dataset.svc === "response" && S.surface === "web") { S.svc.response = { state: "ready" }; log("response-connect", "Response checks use the Connect sign-in · " + actor()); render(); toast("Response checks connected — no new window on the web"); } else signIn(b.dataset.svc); break;
      case "cancel-signin": cancelSignIn(b.dataset.svc); break;
      case "disconnect": clearTimeout(timers.graph); S.svc.graph = { state: "idle" }; S.svc.exchange = { state: "idle" }; S.svc.response = { state: "idle" }; persist(true); render(); break;
      case "manage-profiles": dialog("Customer connections", `<p class="subtitle">Local PowerShell connections · choose a customer certificate or keep delegated passkey sign-in. These forms collect a registration; they never navigate.</p><div class="row-actions" style="margin:14px 0"><button type="button" class="primary" data-act="close-dialog">Use existing registration</button><button type="button" data-act="close-dialog">Create registrations…</button></div><section class="notice"><strong>Contoso</strong><p>7d3f2c1a-5b6e-4f70-9a8d-1c2b3e4f5a6b<br>Certificate expires 2027-03-01 00:00 UTC<br>Graph: 4b2e91c0-…<br>Exchange: 91c0e4b2-…</p><button type="button" class="text-button" data-act="close-dialog">Remove local profile</button></section>`); break;
      case "save-plan": toast("Plan saved · triage-plan-….json — open it in the desktop app with Open a plan (simulated)"); break;
      case "save-now": persist(true); toast(S.surface === "app" ? "Case saved to ~/Triage evidence/saved-cases" : "Case saved on this device (one file per case; earlier saved cases are kept)"); break;
      case "start-collection": startCollection(); break;
      case "stop": endCollection(true); break;
      case "resume": if (k) { for (const s of k.sources) if (s.state !== "complete") { s.state = "complete"; s.count = COUNTS[s.key]; s.note = ""; } k.records = k.sources.reduce((n, s) => n + s.count, 0); k.partial = 0; log("collection-end", "Incomplete sources resumed and completed."); render(); toast("Incomplete sources completed"); } break;
      case "open-finding": navigate({ ...route, step: "review", tab: "findings", f: b.dataset.id, r: "" }); break;
      case "open-record": closeDialog(); navigate({ ...route, step: "review", tab: route.step === "review" ? route.tab : "evidence", r: b.dataset.ref, s: route.step === "review" ? route.s : b.dataset.ref.split(":")[0] }); break;
      case "back-to-finding": navigate({ ...route, r: "" }); break;
      case "close-drawer": history.back(); break;
      case "toggle-source": navigate({ ...route, s: route.s === b.dataset.src ? "" : b.dataset.src, r: "" }, true); break;
      case "evidence-source": if (k && (k.collecting || k.analyzing)) { toast("Evidence opens in Review when collection ends."); break; } navigate({ step: "review", tab: "evidence", s: b.dataset.src, caseId: k?.id }); break;
      case "clear-state-filter": navigate({ ...route, state: "" }); break;
      case "contain-account": k.responseTarget = b.dataset.user; persist(); navigate({ step: "respond", tab: "contain", caseId: k.id }); break;
      case "choose-account": k.responseTarget = ""; render(); break;
      case "pick-target": k.responseTarget = b.dataset.user; log("note", "Affected account for response: " + b.dataset.user); render(); break;
      case "export-starting-point": k.startingPointExported = shortTime(); k.exports["Case file"] = k.startingPointExported; log("case-exported", "Starting point exported before response"); render(); toast("Starting point exported (simulated)"); break;
      case "arm": arm(); break;
      case "cancel-arm": clearTimeout(timers.arm); k.arming = 0; render(); break;
      case "disarm": k.armed = false; log("response-disarmed", "Write permissions released"); render(); break;
      case "write": writeAction(b.dataset.key); break;
      case "load": k.steps[b.dataset.key] = { ...(k.steps[b.dataset.key] || {}), loaded: true }; log("response-result", (b.dataset.key === "methods" ? "Loaded 2 authentication methods" : "Loaded 2 OAuth grants") + " for " + (k.responseTarget || k.subject)); render(); break;
      case "run-impact": k.impactRun = shortTime(); log("response-result", "Ran 13 blast-radius checks over " + k.days + " days · 2 need attention"); render(); break;
      case "collect-mailbox": { const s = k.sources.find(x => x.key === "exchange"); if (s) { s.state = "complete"; s.count = COUNTS.exchange; } else k.sources.push({ key: "exchange", state: "complete", count: COUNTS.exchange }); k.records += COUNTS.exchange; k.partial = k.sources.filter(x => x.state !== "complete").length; if (!k.findings.some(f => f.id === "F9")) k.findings.push(FINDINGS.find(f => f.id === "F9")); log("source-result", "Mailbox configuration snapshot · complete · 14 records"); render(); toast("Mailbox evidence added to the case"); break; }
      case "template": toast("Draft downloaded · " + b.dataset.what + " · not a record that it was sent"); log("note", "Downloaded template: " + b.dataset.what + " · draft only"); break;
      case "phase-note": phaseNoteDialog(); break;
      case "export": exportThing(b.dataset.what); break;
      case "review-unreviewed": navigate({ step: "review", tab: "findings", state: "unreviewed", caseId: k.id }); break;
      case "next-investigation": finishAndReset(); break;
      case "new-case": navigate({ step: "newcase" }); break;
      case "confirm-new": finishAndReset(); break;
      case "noop": toast("Native folder dialog — simulated"); break;
    }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault(); const k = S.kase;
    if (e.target.id === "review-form") {
      const f = e.target, id = f.dataset.id, state = f.elements.state.value, note = f.elements.note.value.trim(), reference = f.elements.reference.value.trim();
      const err = {}; if (!note) err.note = "Add your reason and supporting facts before saving."; if (state === "confirmed" && !RECORDS[reference]) err.reference = "Confirmation needs an existing evidence reference, e.g. " + (k.findings.find(x => x.id === id)?.refs[0] || "interactive:12") + ".";
      k.reviewError = err; if (Object.keys(err).length) { render(); return; }
      k.dispositions[id] = { state, note, reference, at: shortTime() }; log("finding-review", id + " · " + state + (reference ? " [" + reference + "]" : "") + " — " + note);
      history.back(); toast("Finding review recorded · " + state);
    }
    if (e.target.id === "phase-form") {
      const f = e.target, detail = f.elements.detail.value.trim(); if (!detail) { f.elements.detail.focus(); return; }
      const phase = route.step === "respond" ? (route.tab || "preserve") : "handover";
      k.phaseOutcomes[phase] = { outcome: f.elements.outcome.value, detail, reference: f.elements.reference.value.trim() };
      log("phase-outcome", (PHASES.find(p => p[0] === phase)?.[1] || "Note") + ": " + f.elements.outcome.value + " — " + detail); closeDialog(); render(); toast("Outcome added to the action log");
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "upn") { S.scope.upn = t.value; persist(); const pos = t.selectionStart; render(); const el = $("#upn"); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} } }
    if (t.id === "domain") { S.domain = t.value; if (S.tenant && TENANTS[t.value.trim().toLowerCase()]?.[0] !== S.tenant.name) { S.tenant = null; render(); const el = $("#domain"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } }
    if (t.id === "finding-filter") { S.filter = t.value; const pos = t.selectionStart; render(); const el = $("#finding-filter"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  });
  document.addEventListener("change", (e) => {
    const t = e.target, k = S.kase;
    if (t.id === "theme") { themeMode = t.value; applyTheme(); try { localStorage.setItem(THEME_KEY, themeMode); } catch (err) {} }
    if (t.id === "tenantMode") { S.tenantMode = t.value; S.tenant = null; persist(); render(); }
    if (t.id === "signAs") { S.signAs = t.value; S.svc.graph = { state: "idle" }; S.svc.exchange = { state: "idle" }; persist(); render(); }
    if (t.id === "scopeMode") { S.scope.mode = t.value; if (S.scope.mode === "tenant" && S.scope.preset === "standard") S.scope.preset = "quick"; persist(); render(); }
    if (t.id === "days") { S.scope.days = Number(t.value); persist(); }
    if (t.name === "preset") { S.scope.preset = t.value; if (t.value !== "custom") S.scope.custom = PRESETS[t.value].slice(); persist(); render(); }
    if (t.id === "severity") { S.severity = t.value; render(); }
    if (t.dataset.src) { const set = new Set(S.scope.custom); t.checked ? set.add(t.dataset.src) : set.delete(t.dataset.src); S.scope.custom = [...set]; persist(); }
    if (t.dataset.skip && k) { k.steps[t.dataset.skip] = { ...(k.steps[t.dataset.skip] || {}), status: t.checked ? "skipped" : "" }; log("checklist", (t.checked ? "Deliberately skipped: " : "Un-skipped: ") + STEPS.find(s => s[0] === t.dataset.skip)[1]); render(); }
    if (t.id === "domain") { const d = t.value.trim().toLowerCase(); if (TENANTS[d]) { S.domain = d; S.tenant = { name: TENANTS[d][0], id: TENANTS[d][1] }; persist(); render(); } }
  });
  setInterval(() => { for (const el of document.querySelectorAll("[data-elapsed]")) { const key = el.dataset.elapsed; const since = key === "arm" ? S.kase?.arming : S.svc[key]?.since; if (since) el.textContent = elapsed(since); } }, 1000);
  const bootReady = () => { if (S.surface === "app" && route.step === "connect" && S.ready !== "ok" && S.ready !== "checking") { S.ready = "checking"; setTimeout(() => { S.ready = "ok"; persist(true); if (route.step === "connect") render(); }, 1400); } };
  window.addEventListener("popstate", bootReady);
  document.addEventListener("click", () => setTimeout(bootReady, 0), true);
  applyTheme(); render(); bootReady();
})();
</script>
